name: Weekly reliability report

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore snapshots
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: reports/sample_snapshot.csv
          key: weekly-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weekly-snapshot-
      - name: Build sample and report
        run: python src/weekly_report.py --sample --reports reports
      - name: Save snapshots
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: reports/sample_snapshot.csv
          key: weekly-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-reliability-report
          path: |
            reports/weekly_report.md
            reports/data_quality_report.csv
          if-no-files-found: error
